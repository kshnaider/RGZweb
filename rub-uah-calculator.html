<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Курс RUB ⇄ UAH</title>
<link rel="icon" href="../favicon-32x32.png">
<link rel="icon" href="../favicon-16x16.png">


<script src="https://www.cbr-xml-daily.ru/money.js"></script>


<script>

function CBR_XML_Daily_Ru(rates) {


    window.uahRate = rates.Valute.UAH.Value / 10;


    let rateBlock = document.getElementById("rate");

    rateBlock.innerHTML =
        "1 UAH = " +
        window.uahRate.toFixed(4).replace('.', ',') +
        " RUB";
}

</script>

<script src="//www.cbr-xml-daily.ru/daily_jsonp.js" async></script>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(180deg,#eef3ff,#f8fbff);
    color:#1b2a4a;
}


header{
    background:linear-gradient(90deg,#0d47a1,#ff8c00);
    color:white;
    text-align:center;
    padding:25px;
    font-size:32px;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}


.container{
    width:90%;
    max-width:1100px;
    margin:30px auto;
}


.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:30px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}


h2{
    margin-top:0;
    color:#0d47a1;
}


input{
    width:100%;
    padding:14px;
    margin-top:10px;
    margin-bottom:15px;

    border-radius:10px;
    border:1px solid #ccc;

    font-size:16px;
    box-sizing:border-box;
}


button{
    background:linear-gradient(90deg,#ff8c00,#ff6a00);
    color:white;
    border:none;

    padding:12px 20px;
    border-radius:10px;

    cursor:pointer;
    font-size:16px;
    font-weight:bold;

    transition:0.3s;
}

button:hover{
    transform:scale(1.03);
}


#rate{
    margin-bottom:20px;
    font-size:20px;
    font-weight:bold;
    color:#0d47a1;
}


.result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}


.chart{
    display:flex;
    align-items:flex-end;
    gap:4px;

    height:320px;

    margin-top:30px;

    border-bottom:2px solid #ccc;
    padding-bottom:10px;
}


.bar{
    flex:1;
    background:#1e88e5;

    border-radius:6px 6px 0 0;

    cursor:pointer;
    transition:0.3s;
}

.bar:hover{
    background:#ff8c00;
}


.bar.active{
    background:#ff6a00;
}


.info{
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
    color:#0d47a1;
}

.burger {
    position: fixed;
    top: 18px;
    right: 20px;
    width: 35px;
    height: 25px;
    cursor: pointer;
    z-index: 2000;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.burger span {
    height: 4px;
    background: white;
    border-radius: 3px;
    transition: 0.3s;
}


.side-menu {
    position: fixed;
    top: 0;
    right: -260px;
    width: 240px;
    height: 100%;
    background: linear-gradient(180deg, #0d47a1, #1e88e5);
    color: white;
    padding: 60px 20px;
    transition: 0.4s ease;
    z-index: 1500;
    box-shadow: -10px 0 25px rgba(0,0,0,0.2);
}

.side-menu h2 {
    margin-bottom: 20px;
}

.side-menu a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 12px 0;
    font-size: 16px;
    opacity: 0.9;
}

.side-menu a:hover {
    opacity: 1;
    transform: translateX(5px);
    transition: 0.2s;
}


.side-menu.open {
    right: 0;
}


.overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.4);
    opacity: 0;
    visibility: hidden;

    transition: 0.3s;
    z-index: 1400;
}

</style>
</head>

<body>

<div class="burger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="sideMenu" class="side-menu">
    <h2 style="color: white;">Меню</h2>
    <a href="company.html">О компании</a>
    <a href="news.html">Новости</a>
    <a href="rub-uah-calculator.html">Курс валют</a>
    <a href="map.html">Контакты</a>
    <a href="record.html">Видео</a>
</div>


<div id="overlay" class="overlay" onclick="toggleMenu()"></div>

<header>
Курс RUB ⇄ UAH
</header>

<div class="container">


<div class="card">

<h2>Калькулятор валют</h2>

<div id="rate">
Загрузка курса...
</div>

<input type="number" id="rub" placeholder="Введите рубли (RUB)">

<button onclick="rubToUah()">
Перевести в гривны
</button>

<br><br>

<input type="number" id="uah" placeholder="Введите гривны (UAH)">

<button onclick="uahToRub()">
Перевести в рубли
</button>

<div class="result" id="result"></div>

</div>


<div class="card">

<h2>Изменение курса UAH за месяц</h2>

<div class="chart" id="chart"></div>

<div class="info" id="info">
Нажмите на столбец графика
</div>

</div>

</div>

<script>


function rubToUah(){

    let rub =
        document.getElementById("rub").value;

    let result =
        fx(rub)
        .from("RUB")
        .to("UAH");

    document.getElementById("result").innerHTML =
        rub + " RUB = " +
        result.toFixed(2) +
        " UAH";
}


function uahToRub(){

    let uah =
        document.getElementById("uah").value;

    let result =
        fx(uah)
        .from("UAH")
        .to("RUB");

    document.getElementById("result").innerHTML =
        uah + " UAH = " +
        result.toFixed(2) +
        " RUB";
}


const values = [
2.41,2.42,2.40,2.39,2.43,
2.45,2.44,2.46,2.47,2.48,
2.44,2.42,2.40,2.39,2.41,
2.43,2.44,2.45,2.46,2.47,
2.48,2.49,2.50,2.48,2.47,
2.46,2.45,2.44,2.43,2.42
];


function createChart(){

    const chart =
        document.getElementById("chart");

    const max =
        Math.max(...values);

    values.forEach((value,index)=>{

        const bar =
            document.createElement("div");

        bar.className = "bar";

        bar.style.height =
            (value / max * 280) + "px";

        
        bar.onclick = ()=>{

            document
                .querySelectorAll(".bar")
                .forEach(b =>
                    b.classList.remove("active")
                );

            bar.classList.add("active");

            const date = new Date();

            date.setDate(
                date.getDate() - (29-index)
            );

            document.getElementById("info").innerHTML =
                "Дата: " +
                date.toLocaleDateString() +
                "<br>Курс: " +
                value.toFixed(2) +
                " RUB";
        };

        chart.appendChild(bar);

    });

}

function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");

    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}


createChart();

</script>

</body>
</html>
